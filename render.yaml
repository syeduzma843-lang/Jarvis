# Render Blueprint — deploys the backend + a managed Postgres database in
# one step. In the Render dashboard: New -> Blueprint -> point at your repo
# -> Render reads this file automatically.
#
# NOTE ON COST: Render's exact free-tier terms change over time and were
# inconsistent across sources when this was written — verify current pricing
# at render.com/pricing before deploying. Regardless of free-tier
# availability, a free/spin-down instance adds a 30-60s cold-start delay,
# which is a bad fit for a "low latency" voice assistant — a cheap always-on
# plan is the right call here even if free is available.
#
# NOTE ON CHROMA: long-term vector memory (ChromaDB) is written to local
# disk. Render's ephemeral filesystem wipes it on every redeploy unless you
# attach a persistent Disk (see the commented `disk:` block below, which
# requires a paid instance type).

services:
  - type: web
    name: jarvis-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: backend
    plan: starter          # cheapest always-on tier; verify current name/price in dashboard
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEFAULT_LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false         # set manually in the Render dashboard (secret)
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: BACKEND_API_KEY
        generateValue: true  # Render generates a random secret — copy it into the Android app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
    # Uncomment once you're on a plan that supports persistent disks, so
    # long-term memory survives redeploys:
    # disk:
    #   name: chroma-data
    #   mountPath: /app/chroma_data
    #   sizeGB: 1

databases:
  - name: jarvis-db
    plan: free   # verify current free-tier expiry/limits in the dashboard before relying on this for real data
